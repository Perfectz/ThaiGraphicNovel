<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta
      name="description"
      content="Bangkok Rift — a 3-stage Thai language tech demo. Patrick falls through a magic rift into Bangkok and learns survival Thai with Su, an AI tutor princess. About 20 minutes. Mic optional."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M32 8 42 28H22L32 8Z' fill='%23facc15'/%3E%3Ccircle cx='32' cy='36' r='14' fill='%2367e8f9'/%3E%3Cpath d='M16 54h32' stroke='%23fef3c7' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2305070d'/%3E%3Cpath d='M90 24 118 79H62L90 24Z' fill='%23facc15'/%3E%3Ccircle cx='90' cy='102' r='38' fill='%2367e8f9'/%3E%3Cpath d='M44 152h92' stroke='%23fef3c7' stroke-width='14' stroke-linecap='round'/%3E%3C/svg%3E"
    />

    <!-- Open Graph — when someone pastes the URL into Slack/Discord/Twitter,
         the preview card shows real content instead of "Vite + React". The
         /og-card.png referenced here is generated by `npm run promo:og-card`
         (see scripts/generate-og-card.mjs); ships as a static asset in
         public/ once you've generated it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bangkok Rift — Isekai Thai Quest" />
    <meta
      property="og:description"
      content="A 3-stage Thai language tech demo. Patrick falls through a magic rift into Bangkok and learns survival Thai with Su, an AI tutor princess. About 20 minutes. Mic optional."
    />
    <meta property="og:site_name" content="Bangkok Rift" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bangkok Rift title card — Patrick and Su in a neon-lit hotel lobby." />

    <!-- Twitter / X / Bluesky / Mastodon read summary_large_image for the
         big-image preview format. Falls back to og:* if Twitter-specific
         tags are missing, but specifying both is the safe bet. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bangkok Rift — Isekai Thai Quest" />
    <meta
      name="twitter:description"
      content="A 3-stage Thai language tech demo with voice (or read-and-tap) gameplay. Patrick wakes up in Bangkok. Su teaches him to survive."
    />
    <meta name="twitter:image" content="/og-card.png" />

    <!-- DNS prefetch so the Realtime mode handshake to OpenAI starts a tiny
         bit faster — has no effect on Whisper or No-mic paths. -->
    <link rel="dns-prefetch" href="https://api.openai.com" />

    <title>Bangkok Rift — Isekai Thai Quest</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p
        style="
          color: #f4f1eb;
          background: #0a0a0b;
          font-family: system-ui;
          padding: 2rem;
          text-align: center;
          margin: 0;
          min-height: 100dvh;
          display: grid;
          place-content: center;
        "
      >
        Bangkok Rift requires JavaScript to play. Please enable JavaScript and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
