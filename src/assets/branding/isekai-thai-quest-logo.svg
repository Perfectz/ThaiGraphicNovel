<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" fill="none" role="img" aria-label="Isekai Thai Quest">
  <defs>
    <style>
      .latin {
        font-family: "Trebuchet MS", "Helvetica Neue", "Arial Black", sans-serif;
        font-weight: 900;
        fill: #F4F1EB;
        letter-spacing: -0.01em;
      }
      .thai {
        font-family: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
        font-weight: 700;
        fill: #F4F1EB;
        letter-spacing: 0.02em;
      }
      .rule {
        stroke: #67E8F9;
        stroke-width: 4;
      }
      .shadow {
        fill: rgba(2, 6, 23, 0.55);
      }
    </style>
  </defs>
  <!-- soft offset shadow for readability over the 3D scene -->
  <text class="latin shadow" x="6" y="146" font-size="148">ISEKAI</text>
  <text class="latin shadow" x="6" y="276" font-size="148">THAI QUEST</text>
  <!-- main wordmark -->
  <text class="latin" x="0" y="140" font-size="148">ISEKAI</text>
  <text class="latin" x="0" y="270" font-size="148">THAI QUEST</text>
  <!-- accent rule under the Latin block -->
  <line class="rule" x1="0" y1="298" x2="148" y2="298" />
  <!-- Thai sub-wordmark -->
  <text class="thai" x="164" y="340" font-size="44">อิเซไก ไทย เควสต์</text>
</svg>
